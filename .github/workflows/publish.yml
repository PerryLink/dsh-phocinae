name: Publish

on:
  # workflow_dispatch is how a tag whose publish failed gets re-run after a fix:
  # a tag push executes the workflow file AT THE TAGGED COMMIT, so a fix committed
  # after the tag would never run under that tag. Dispatching on the branch runs
  # this file and checks out the fixed tree.
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # No registry-url: it writes //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          # into .npmrc, and an empty bearer token makes the registry answer 404 on
          # PUT instead of letting npm perform the OIDC trusted-publishing exchange.

      - name: Unit and contract tests
        run: npm test

      - name: Gate-over-HTTP integration
        run: node test/integration/gate-over-http.mjs

      # Trusted publishing needs npm >= 11.5.1. The diagnostics make a failure
      # self-explanatory: npm swallows OIDC exchange errors unless verbose.
      - name: Upgrade npm and show what the publish will authenticate with
        run: |
          npm install -g npm@^11.5.1
          echo "npm: $(npm --version)"
          echo "registry: $(npm config get registry)"
          if [ -f .npmrc ]; then echo "--- workspace .npmrc ---"; cat .npmrc; else echo "no workspace .npmrc"; fi
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then echo "OIDC request TOKEN: present"; else echo "OIDC request TOKEN: MISSING"; fi

      - name: Publish to npm
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "dsh-phocinae@${version}" version >/dev/null 2>&1; then
            echo "dsh-phocinae@${version} is already published; skipping npm publish"
            exit 0
          fi
          # npm's read side can lag a successful publish, so a re-pushed tag can miss it
          # and hit E409 ("Cannot publish over previously staged version"). That means the
          # version already exists, so report it as done instead of failing the job.
          set +e
          out="$(npm publish --provenance 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$out"
          if [ "$status" -ne 0 ]; then
            if printf '%s' "$out" | grep -q 'E409'; then
              echo "already on the registry (E409); treating the publish as done"
            else
              exit "$status"
            fi
          fi
        env:
          NPM_CONFIG_LOGLEVEL: verbose

  # npm publish alone leaves every release without a GitHub Release page. This job
  # closes that gap and is idempotent, so re-running a tag is safe.
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create the GitHub Release from the CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag push releases the pushed tag; a workflow_dispatch run on a branch
          # releases the version in package.json (that tag already exists).
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            REF_NAME="${GITHUB_REF_NAME}"
          else
            REF_NAME="v$(node -p "require('./package.json').version")"
          fi
          if gh release view "${REF_NAME}" >/dev/null 2>&1; then
            echo "release ${REF_NAME} already exists; skipping"
            exit 0
          fi
          VERSION="${REF_NAME#v}"
          # A CHANGELOG missing this version's section must not fail the job: npm has
          # already published by now, and a missing Release page is exactly the gap this
          # job exists to close. Fall back to generated notes instead of going red.
          node scripts/changelog-section.mjs "$VERSION" > release-notes.md || true
          if [ -s release-notes.md ]; then
            gh release create "${REF_NAME}" \
              --title "${REF_NAME}" \
              --notes-file release-notes.md
          else
            gh release create "${REF_NAME}" --generate-notes
          fi
